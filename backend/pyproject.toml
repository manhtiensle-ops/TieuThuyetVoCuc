[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Novel Platform Dev", email = "novel-platform@dev.local" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt<4.0.0",
    "celery>=5.6.3",
    "embedded-postgres>=18.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "markdown>=3.10.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "testing-postgresql>=1.3.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
